name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "deploy/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "deploy/**"]

jobs:
  # Image jobs run on GitHub-hosted amd64 runners: they build `linux/amd64`, which
  # is NATIVE there. On the arm64 self-hosted fleet the same build is emulated by
  # QEMU, whose x86 emulation segfaults non-deterministically inside `npm ci`
  # (see the RUNNERS note in build-and-push.yml). Test-only jobs also use standard
  # GitHub machines; no developer workstation runner is used.
  frontend-image:
    name: frontend image supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Enforce minimal container policy
        run: |
          ./scripts/test-container-policy.sh
          ./scripts/test-bridge-container-policy.sh
      - name: Build the exact review candidate
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg ATRIUM_VERSION=ci \
            --build-arg ATRIUM_REVISION="$GITHUB_SHA" \
            --file docker/Dockerfile \
            --tag local/atrium:ci \
            .
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: local/atrium:ci
          format: spdx-json
          artifact-name: atrium-frontend-sbom.spdx.json
          syft-version: v1.48.0
          upload-artifact-retention: 90
      - name: Report frontend image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/atrium:ci
          fail-build: false
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: ${{ runner.temp }}/atrium-frontend-vulnerabilities.json
          grype-version: v0.116.0
      - name: Validate and summarize frontend vulnerability findings
        run: node scripts/vulnerability-report.mjs grype "$RUNNER_TEMP/atrium-frontend-vulnerabilities.json"
      - name: Retain frontend vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrium-frontend-vulnerabilities
          path: ${{ runner.temp }}/atrium-frontend-vulnerabilities.json*
          retention-days: 90
          if-no-files-found: warn

  app:
    name: app (front + Convex)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Report application dependency vulnerabilities
        run: node scripts/vulnerability-report.mjs npm-production "$RUNNER_TEMP/npm-security/production.json"

      - name: Report deployer development dependency vulnerabilities
        run: node scripts/vulnerability-report.mjs npm-development "$RUNNER_TEMP/npm-security/development.json"

      - name: Retain dependency vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrium-npm-vulnerabilities-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/npm-security/
          retention-days: 90
          if-no-files-found: warn

      - name: Verify dependency security policy
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=scripts/vulnerability-report.mjs
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          scripts/dependency-security.test.mjs scripts/vulnerability-report.test.mjs

      # convex/_generated is committed (Convex convention) so typecheck/build run
      # without a live backend. The front↔convex contract is enforced here: a
      # mismatch between src/ and the generated API fails the typecheck.
      - name: Typecheck
        run: npm run typecheck

      # SEPARATE, NAMED step even though `typecheck` already chains it: this is the
      # gate whose ABSENCE cost days. `convex dev` / `npx convex deploy` run `tsc`
      # over `convex/**` with convex/tsconfig.json — a DIFFERENT project from the
      # root one (its own `lib`, the one Convex's template declares, and it INCLUDES
      # the test files). On 2026-07-26 a single excess-property error in
      # `convex/authDomains.test.ts` silently blocked EVERY push for days behind a
      # fully green CI, and would have failed a production `convex deploy`. Named
      # here so the failure reads as what it is: the deploy is broken.
      - name: Typecheck Convex (the `convex deploy` gate)
        run: npm run typecheck:convex

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  bridge:
    name: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test

  bridge-image:
    name: bridge image supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build the exact bridge review candidate
        run: |
          docker build --platform linux/amd64 \
            --build-arg ATRIUM_VERSION=ci \
            --build-arg ATRIUM_REVISION="$GITHUB_SHA" \
            --file bridge/Dockerfile \
            --tag local/atrium-bridge:ci \
            bridge
      - name: Report bridge image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/atrium-bridge:ci
          fail-build: false
          severity-cutoff: critical
          only-fixed: false
          output-format: json
          output-file: ${{ runner.temp }}/atrium-bridge-vulnerabilities.json
          grype-version: v0.116.0
      - name: Validate and summarize bridge vulnerability findings
        run: node scripts/vulnerability-report.mjs grype "$RUNNER_TEMP/atrium-bridge-vulnerabilities.json"
      - name: Retain bridge vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrium-bridge-vulnerabilities
          path: ${{ runner.temp }}/atrium-bridge-vulnerabilities.json*
          retention-days: 90
          if-no-files-found: warn
