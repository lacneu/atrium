# OPT-IN EXAMPLE — not loaded unless you list it. Stores Convex files in
# S3-compatible object storage instead of the convex-data volume. The default
# stack (docker-compose.yml alone) is unchanged by this file's presence.
# To use it, layer it on the main file, in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.s3.yml
#
# Setting COMPOSE_FILE in .env makes EVERY `docker compose` command in this
# directory see the same configuration — prefer it to `-f` by hand, where one
# forgotten flag recreates the backend WITHOUT its storage. (Under Dokploy, paste
# the same `environment:` entries into the compose definition instead.)
#
# What moves to the buckets: uploaded files, deployed function bundles, search
# index snapshots, snapshot exports and imports. The database itself stays in
# the convex-data volume (SQLite).
#
# ONLY FOR A NEW DEPLOYMENT. The storage kind is recorded in the database the
# first time the backend starts; a deployment created on local storage refuses
# to start with these variables ("Database was initialized with Local …, but
# backend started up with S3"). Moving an existing deployment is an export and
# an import into a fresh one: docs/installation/MIGRATION.md.
#
# The variable names below are the ones the upstream backend reads
# (get-convex/convex-backend: self-hosted/advanced/s3_storage.md and
# self-hosted/docker-build/run_backend.sh). The backend switches to S3 only when
# ALL SIX of AWS_REGION and the five S3_STORAGE_*_BUCKET are non-empty; with only
# some of them it logs a warning and silently falls back to local storage — so
# every one is required here.
#
# Buckets: five distinct, PRIVATE buckets, created before the first start. The
# backend prefixes every key with `<instance name>-<random>/`. The browser never
# reaches them — files are served through the Convex origin (/api/storage/<id>).
services:
  convex-backend:
    environment:
      - AWS_REGION=${CONVEX_S3_REGION:?region of the S3 endpoint (any non-empty value for a self-hosted server, e.g. us-east-1)}
      - AWS_ACCESS_KEY_ID=${CONVEX_S3_ACCESS_KEY_ID:?access key allowed to read+write the five buckets}
      - AWS_SECRET_ACCESS_KEY=${CONVEX_S3_SECRET_ACCESS_KEY:?secret of that access key}
      # Endpoint of a non-AWS provider or of your own S3-compatible server.
      # Leave empty for AWS.
      - S3_ENDPOINT_URL=${CONVEX_S3_ENDPOINT_URL:-}
      # Path-style addressing (https://host/bucket/key). Required by most
      # self-hosted servers and many providers; harmless where virtual-host
      # style also works.
      - AWS_S3_FORCE_PATH_STYLE=${CONVEX_S3_FORCE_PATH_STYLE:-true}
      # Compatibility switches for providers that reject AWS's server-side
      # encryption headers or its default checksums. Leave false unless uploads
      # fail with a provider error that names them.
      - AWS_S3_DISABLE_SSE=${CONVEX_S3_DISABLE_SSE:-false}
      - AWS_S3_DISABLE_CHECKSUMS=${CONVEX_S3_DISABLE_CHECKSUMS:-false}
      - S3_STORAGE_FILES_BUCKET=${CONVEX_S3_FILES_BUCKET:?bucket for uploaded files}
      - S3_STORAGE_MODULES_BUCKET=${CONVEX_S3_MODULES_BUCKET:?bucket for deployed function bundles}
      - S3_STORAGE_SEARCH_BUCKET=${CONVEX_S3_SEARCH_BUCKET:?bucket for search index snapshots}
      - S3_STORAGE_EXPORTS_BUCKET=${CONVEX_S3_EXPORTS_BUCKET:?bucket for snapshot exports}
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET=${CONVEX_S3_SNAPSHOT_IMPORTS_BUCKET:?bucket for snapshot imports}
