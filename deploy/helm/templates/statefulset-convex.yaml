{{- /*
Convex backend — STATEFUL. A single-replica StatefulSet with a PVC via
volumeClaimTemplates. It is NOT horizontally scalable: replicas is hard-pinned
to 1. The SQLite data at /convex/data survives pod recreation; that is the
disposability contract for this stack. Back up with `npx convex export`, not a
volume snapshot.
*/ -}}
{{- $svc := include "atrium.convexBackendService" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "atrium.componentName" (dict "ctx" . "component" "convex-backend") }}
  labels:
    {{- include "atrium.labels" . | nindent 4 }}
    app.kubernetes.io/component: convex-backend
spec:
  # NOT horizontally scalable — single replica only.
  replicas: 1
  serviceName: {{ $svc }}
  selector:
    matchLabels:
      {{- include "atrium.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: convex-backend
  template:
    metadata:
      labels:
        {{- include "atrium.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: convex-backend
      {{- with .Values.convexBackend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: convex-backend
          image: {{ include "atrium.image" (dict "repository" .Values.convexBackend.image "tag" .Values.convexBackend.tag "defaultTag" "latest") }}
          imagePullPolicy: {{ .Values.convexBackend.pullPolicy }}
          ports:
            - name: cloud
              containerPort: {{ .Values.convexBackend.cloudPort }}
            - name: site
              containerPort: {{ .Values.convexBackend.sitePort }}
          env:
            # Identity that mints the admin key (from the Secret).
            - name: INSTANCE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "atrium.secretName" . }}
                  key: CONVEX_INSTANCE_NAME
            - name: INSTANCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "atrium.secretName" . }}
                  key: CONVEX_INSTANCE_SECRET
            # PUBLIC https origins the BROWSER reaches (values, not service DNS).
            - name: CONVEX_CLOUD_ORIGIN
              value: {{ .Values.convex.cloudOrigin | quote }}
            - name: CONVEX_SITE_ORIGIN
              value: {{ .Values.convex.siteOrigin | quote }}
            - name: DISABLE_BEACON
              value: "true"
            - name: RUST_LOG
              value: {{ .Values.convexBackend.rustLog | quote }}
            # Retention of superseded/deleted document versions (seconds).
            - name: DOCUMENT_RETENTION_DELAY
              value: {{ .Values.convexBackend.documentRetentionDelaySeconds | quote }}
            {{- with .Values.convexBackend.s3 }}
            {{- if .enabled }}
            # Opt-in S3-compatible object storage (upstream
            # self-hosted/advanced/s3_storage.md). The backend switches to S3 only
            # when AWS_REGION and all five buckets are set — a partial set silently
            # falls back to the PVC, hence `required`. NEW deployments only: a
            # database created on local storage refuses to start on S3
            # (docs/installation/MIGRATION.md). The Secret must then also hold
            # CONVEX_S3_ACCESS_KEY_ID and CONVEX_S3_SECRET_ACCESS_KEY.
            - name: AWS_REGION
              value: {{ required "convexBackend.s3.region is required when s3.enabled" .region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "atrium.secretName" $ }}
                  key: CONVEX_S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "atrium.secretName" $ }}
                  key: CONVEX_S3_SECRET_ACCESS_KEY
            {{- if .endpoint }}
            - name: S3_ENDPOINT_URL
              value: {{ .endpoint | quote }}
            {{- end }}
            - name: AWS_S3_FORCE_PATH_STYLE
              value: {{ .forcePathStyle | quote }}
            - name: AWS_S3_DISABLE_SSE
              value: {{ .disableSse | quote }}
            - name: AWS_S3_DISABLE_CHECKSUMS
              value: {{ .disableChecksums | quote }}
            - name: S3_STORAGE_FILES_BUCKET
              value: {{ required "convexBackend.s3.buckets.files is required" .buckets.files | quote }}
            - name: S3_STORAGE_MODULES_BUCKET
              value: {{ required "convexBackend.s3.buckets.modules is required" .buckets.modules | quote }}
            - name: S3_STORAGE_SEARCH_BUCKET
              value: {{ required "convexBackend.s3.buckets.search is required" .buckets.search | quote }}
            - name: S3_STORAGE_EXPORTS_BUCKET
              value: {{ required "convexBackend.s3.buckets.exports is required" .buckets.exports | quote }}
            - name: S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
              value: {{ required "convexBackend.s3.buckets.snapshotImports is required" .buckets.snapshotImports | quote }}
            {{- end }}
            {{- end }}
          # The backend shuts down cleanly on SIGINT and ignores SIGTERM, which is
          # all Kubernetes sends; without this hook every pod stop ends in SIGKILL
          # once the grace period runs out. PID 1 is the backend (run_backend.sh
          # execs it); the sleep keeps the hook alive until the process exits.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -INT 1; sleep 50"]
          readinessProbe:
            httpGet:
              path: /version
              port: cloud
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /version
              port: cloud
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /convex/data
          resources:
            {{- toYaml .Values.convexBackend.resources | nindent 12 }}
      {{- with .Values.convexBackend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.convexBackend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.convexBackend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "atrium.labels" . | nindent 10 }}
          app.kubernetes.io/component: convex-backend
      spec:
        accessModes:
          {{- toYaml .Values.convexBackend.persistence.accessModes | nindent 10 }}
        {{- if .Values.convexBackend.persistence.storageClassName }}
        storageClassName: {{ .Values.convexBackend.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.convexBackend.persistence.size | quote }}
